version: '3.9'

services:
  # --- PostgreSQL Database ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mab-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mab_erp
      POSTGRES_USER:     mab
      POSTGRES_PASSWORD: mab_password
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mab -d mab_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mab-net

  # --- Mab ERP Application ---------------------------------------------------
  mab-erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mab-erp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV:      production
      APP_PORT:     "8080"
      DATABASE_URL: postgres://mab:mab_password@postgres:5432/mab_erp?sslmode=disable
      JWT_SECRET:   "CHANGE_ME_IN_PRODUCTION_USE_RANDOM_64_CHAR_STRING"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mab-net

  # --- Optional: pgAdmin for DB management -----------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mab-erp-pgadmin
    restart: unless-stopped
    profiles: ["tools"]          # Only starts with: docker compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@mab-erp.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - mab-net

volumes:
  postgres_data:
    name: mab-erp-postgres-data
  pgadmin_data:
    name: mab-erp-pgadmin-data

networks:
  mab-net:
    name: mab-erp-network
    driver: bridge
